name: Build BlueWake IPA

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Stop the build after this many minutes (15 = test, 320 = real)"
        default: "15"
        required: true
      iso_only:
        description: "Only convert and upload the ISO (skip the build)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Show runner information
        run: |
          sw_vers
          sysctl -n hw.ncpu
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize
          df -h /

      - name: Download Wind Waker disc image
        env:
          WIND_WAKER_URL: ${{ secrets.WIND_WAKER_URL }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          pip3 install --break-system-packages gdown
          mkdir -p "$RUNNER_TEMP/wind-waker"
          cd "$RUNNER_TEMP/wind-waker"
          FILE_ID=$(echo "$WIND_WAKER_URL" | sed -E 's/.*id=([^&]+).*/\1/; s/.*\/d\/([^\/]+).*/\1/')
          gdown "$FILE_ID" -O "WindWaker.rvz"
          ls -lh "WindWaker.rvz"
          SIZE=$(wc -c < "WindWaker.rvz")
          if [ "$SIZE" -lt 500000000 ]; then
            echo "::error::El archivo descargado pesa menos de 500 MB. Revisa el enlace secreto."
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "Tiempo de descarga: $((END_TIME - START_TIME)) segundos."

      - name: Convert RVZ to ISO
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          cd "$RUNNER_TEMP/wind-waker"
          
          echo "Descargando conversor nodtool para macOS..."
          curl -L --fail --retry 3 \
            "https://github.com" \
            -o nodtool.zip || true
          
          if [ -s nodtool.zip ] && unzip -t nodtool.zip >/dev/null 2>&1; then
            unzip -o nodtool.zip
            chmod +x nodtool
            ./nodtool extract "WindWaker.rvz" "WindWaker.iso" || ./nodtool convert "WindWaker.rvz" "WindWaker.iso"
          else
            echo "Usando Dolphin como respaldo..."
            brew install --cask dolphin
            DOLPHIN_BIN=$(find /Applications/Dolphin.app -type f -perm +111 | grep -i "dolphin-tool" | head -n 1 || true)
            if [ -n "$DOLPHIN_BIN" ]; then
              "$DOLPHIN_BIN" convert -i "WindWaker.rvz" -o "WindWaker.iso" -f iso
            else
              echo "Compilando dolphin-tool ligero..."
              brew install cmake ninja
              git clone --depth 1 https://github.com dolphin-src
              mkdir -p dolphin-src/build && cd dolphin-src/build
              cmake .. -GNinja -DENABLE_QT=OFF -DENABLE_GUI=OFF -DENABLE_SDL=OFF -DENABLE_TESTS=OFF -DUSE_DISCORD_PRESENCE=OFF
              ninja dolphin-tool
              ./Binaries/dolphin-tool convert -i "$RUNNER_TEMP/wind-waker/WindWaker.rvz" -o "$RUNNER_TEMP/wind-waker/WindWaker.iso" -f iso
              cd "$RUNNER_TEMP/wind-waker"
            fi
          fi

          ls -lh "WindWaker.iso"
          file "WindWaker.iso"
          ISO_SIZE=$(wc -c < "WindWaker.iso")
          if [ "$ISO_SIZE" -lt 1300000000 ]; then
            echo "::error::La conversion fallo: el archivo ISO pesa menos de 1.3 GB."
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "Tiempo de conversion: $((END_TIME - START_TIME)) segundos."

      - name: Upload ISO
        if: ${{ inputs.iso_only }}
        uses: actions/upload-artifact@v4
        with:
          name: WindWaker-ISO
          path: ${{ runner.temp }}/wind-waker/WindWaker.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Install build tools
        if: ${{ !inputs.iso_only }}
        run: brew install cmake ninja || true

      - name: Restore build cache
        if: ${{ !inputs.iso_only }}
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bluewake
          key: bw-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bw-build-

      - name: Cache status
        if: ${{ !inputs.iso_only }}
        run: |
          echo "Exact hit: ${{ steps.cache.outputs.cache-hit }}"
          echo "Matched key: '${{ steps.cache.outputs.cache-matched-key }}'"
          if [ -d "$RUNNER_TEMP/bluewake" ]; then
            du -sh "$RUNNER_TEMP/bluewake"
          else
            echo "No restored folder (fresh start)"
          fi

      - name: Clone BlueWake
        if: ${{ !inputs.iso_only && steps.cache.outputs.cache-matched-key == '' }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com \
            "$RUNNER_TEMP/bluewake"

      - name: Show BlueWake commit
        if: ${{ !inputs.iso_only }}
        run: |
          cd "$RUNNER_TEMP/bluewake"
          git log -1 --format='%H %s'

      - name: Build IPA (with watchdog)
        if: ${{ !inputs.iso_only }}
        id: build
        env:
          LIMIT_MIN: ${{ inputs.minutes }}
        run: |
          set -u
          set -m

          cd "$RUNNER_TEMP/bluewake"
          chmod +x scripts/builder/build.sh

          FLAGS=(--ipa "$RUNNER_TEMP/BlueWake.ipa" --no-train)
          if grep -q -- '--jobs' scripts/builder/build.sh; then
            FLAGS+=(--jobs 3)
          fi
          if grep -q -- '--no-mods' scripts/builder/build.sh; then
            FLAGS+=(--no-mods)
          fi
          echo "Flags: ${FLAGS[*]}"

          LIMIT=$(( LIMIT_MIN * 60 ))
          echo "Watchdog limit: ${LIMIT_MIN} minutes"

          ./scripts/builder/build.sh \
            "$RUNNER_TEMP/wind-waker/WindWaker.iso" \
            "${FLAGS[@]}" &
          BUILD_PID=$!

          (
            sleep "$LIMIT"
            echo "::warning::Time limit reached, stopping build to save cache"
            kill -TERM -- -"$BUILD_PID" 2>/dev/null
            sleep 20
            kill -KILL -- -"$BUILD_PID" 2>/dev/null
            pkill -KILL -x xcodebuild clang clang++ ninja make 2>/dev/null
          ) &
          WATCHDOG_PID=$!

          wait "$BUILD_PID"
          RC=$?
          kill "$WATCHDOG_PID" 2>/dev/null

          if [ "$RC" -eq 0 ]; then
            echo "Build finished successfully"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "Build stopped or failed (exit $RC). Cache will be saved; run again to resume."
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Save build cache
        if: ${{ always() && !inputs.iso_only }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bluewake
          key: bw-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check IPA
        if: steps.build.outputs.done == 'true'
        run: |
          ls -lh "$RUNNER_TEMP/BlueWake.ipa"
          file "$RUNNER_TEMP/BlueWake.ipa"
          df -h /

      - name: Upload IPA
        if: steps.build.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BlueWake-iOS
          path: ${{ runner.temp }}/BlueWake.ipa
          if-no-files-found: error
          retention-days: 1



